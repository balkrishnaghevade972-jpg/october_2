<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hii pandaaa 🐼</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐼</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Work+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1026;--deep:#1a1440;--moon:#e8ecff;--amber:#f5b86b;--pink:#ff9fb8;--mute:#9aa3cf;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Work Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,var(--night),var(--deep) 55%,var(--night));background-attachment:fixed;color:var(--moon);font-family:var(--sans);font-weight:300;line-height:1.8;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
section{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem}
h1,h2,.line{font-family:var(--serif);font-weight:500;font-style:italic}
h2{font-size:clamp(2rem,6vw,3.2rem);line-height:1.25;margin-bottom:1.2rem}
:focus-visible{outline:2px solid var(--amber);outline-offset:4px}

/* panda */
.panda{width:min(220px,55vw);animation:bob 4s ease-in-out infinite}
.panda svg{width:100%;height:auto;overflow:visible}
@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.blush{animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.tear{fill:#8fd3ff;opacity:0;animation:tear 3.5s 1.5s infinite}
@keyframes tear{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(48px)}}
.happy .tear{display:none}
.happy .blush{opacity:.9;animation:none}

/* intro */
#intro{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,#2a1d5c,var(--night));display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.4s,transform 1.4s}
#intro.gone{opacity:0;transform:scale(1.15);pointer-events:none}
#hi{font-family:var(--serif);font-style:italic;font-size:clamp(3rem,13vw,6.5rem);margin-top:1rem;color:var(--pink);display:flex;flex-wrap:wrap;justify-content:center}
#hi span{display:inline-block;opacity:0;animation:pop .7s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(.9s + var(--i)*.09s)}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.3) rotate(-12deg)}to{opacity:1;transform:none}}
#tap{margin-top:2rem;color:var(--mute);opacity:0;animation:fade 1s 2.8s forwards,breath 2.4s 3.8s infinite}
@keyframes fade{to{opacity:1}}
@keyframes breath{50%{opacity:.35}}

/* hero */
h1{font-size:clamp(3.5rem,13vw,8rem);line-height:1}
body:not(.locked) h1{animation:rise 3s .6s both}
@keyframes rise{from{opacity:0;letter-spacing:.25em;filter:blur(10px)}}
#since{margin-top:2rem;color:var(--mute);font-size:1rem}
body:not(.locked) #since{animation:rise 3s 2s both}
#since b{color:var(--amber);font-weight:400;font-variant-numeric:tabular-nums}
.hint{position:absolute;bottom:1.8rem;color:var(--mute);animation:nudge 2s infinite}
@keyframes nudge{50%{transform:translateY(8px)}}

/* reveal */
.rv{opacity:0;filter:blur(6px);transition:opacity 1.4s,filter 1.4s}
.rv.in{opacity:1;filter:none}

/* story */
#stage{min-height:12rem;display:flex;align-items:center;justify-content:center;max-width:36rem}
.line{font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.4;transition:opacity .9s}
.line.out{opacity:0}
.line::after{content:"|";color:var(--amber);animation:breath 1s infinite;margin-left:2px}
.line.done::after{content:""}
button.soft{margin-top:2.2rem;background:none;border:1px solid var(--mute);color:var(--moon);font:inherit;border-radius:999px;padding:.7rem 2rem;cursor:pointer;transition:all .3s;opacity:0;pointer-events:none}
button.soft.ready{opacity:1;pointer-events:auto}
button.soft:hover{border-color:var(--amber);color:var(--amber);transform:translateY(-2px)}

/* stars */
#sky2{position:relative;width:100%;max-width:40rem;height:55vh;min-height:320px}
#sky2 svg{position:absolute;inset:0;width:100%;height:100%}
.star{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:0;background:none;cursor:pointer;border-radius:50%}
.star::after{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--moon);box-shadow:0 0 14px 4px rgba(232,236,255,.55);animation:tw 3s ease-in-out infinite;animation-delay:var(--d)}
.star.on::after{background:var(--amber);box-shadow:0 0 22px 8px rgba(245,184,107,.75);animation:none}
@keyframes tw{50%{opacity:.4;transform:scale(.6)}}
.ring{position:absolute;inset:18px;border-radius:50%;border:2px solid var(--amber);animation:ring 1s forwards}
@keyframes ring{to{transform:scale(5);opacity:0}}
#sky2 line{stroke-dasharray:400;stroke-dashoffset:400;animation:dash 1.2s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
#thought{min-height:7.5rem;max-width:30rem;font-family:var(--serif);font-style:italic;font-size:1.6rem;line-height:1.45;color:var(--amber);margin-top:1rem}
#thought.swap{animation:swap .8s}
@keyframes swap{from{opacity:0;transform:translateY(12px)}}
#note{color:var(--pink);min-height:2rem}

/* end */
.row{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:2rem}
a.btn,button.btn{font:inherit;text-decoration:none;cursor:pointer;border-radius:999px;padding:.8rem 2.2rem;border:1px solid var(--mute);background:none;color:var(--moon);transition:transform .3s}
a.btn:hover,button.btn:hover{transform:translateY(-3px)}
a.btn.main{background:var(--amber);border-color:var(--amber);color:#2a1a05;font-weight:400;animation:glow 2.5s infinite}
@keyframes glow{50%{box-shadow:0 0 28px 6px rgba(245,184,107,.5)}}
#reply{margin-top:1.5rem;font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--amber);max-width:30rem;min-height:3rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;filter:none}}
</style>
</head>
<body class="locked">
<canvas id="fx" aria-hidden="true"></canvas>

<div id="intro" role="button" tabindex="0" aria-label="Tap to open">
  <div class="panda" data-mood="sad"></div>
  <div id="hi" aria-label="hii pandaaa"></div>
  <p id="tap">tap anywhere, this is for you</p>
</div>

<section id="hero">
  <h1>I miss you.</h1>
  <p id="since"></p>
  <span class="hint">keep scrolling ↓</span>
</section>

<section id="story">
  <div id="stage" aria-live="polite"><p class="line" id="line"></p></div>
  <button class="soft" id="next">Continue</button>
</section>

<section id="stars">
  <div class="rv">
    <h2>Things I thought about<br>while I missed you</h2>
    <p style="color:var(--mute);margin-bottom:1rem">Touch each star.</p>
  </div>
  <div id="sky2" class="rv"><svg id="links" aria-hidden="true"></svg></div>
  <p id="thought" aria-live="polite"></p>
  <p id="note"></p>
</section>

<section id="end">
  <div class="panda rv" id="endPanda" data-mood="sad"></div>
  <h2 id="endTitle" class="rv"></h2>
  <p id="endText" class="rv" style="max-width:28rem;color:var(--mute)"></p>
  <div class="row rv">
    <a class="btn main" id="talk" href="#">Talk to me</a>
    <button class="btn" id="time">I need more time</button>
  </div>
  <p id="reply" aria-live="polite"></p>
</section>

<script>
/* ============ CONFIG: edit everything here ============ */
const CONFIG = {
  intro: "hii pandaaa",
  sinceDate: "2026-09-20T18:00:00",   // when you last talked ("" hides the counter)
  sinceLabel: "since I last heard your voice",
  story: [
    "Hey panda... I know I hurt you.",
    "But I need you to know something.",
    "Everything I did, I did because I missed you.",
    "I wanted your voice. Your laugh. Your attention.",
    "I never did it to annoy you. Never.",
    "I just didn't know how to say it the right way.",
    "So I built this, because words didn't feel enough.",
    "I miss you. More than I know how to explain."
  ],
  thoughts: [
    "I reached for my phone to tell you something, then remembered.",
    "Every funny thing that happened, I wanted you to hear it first.",
    "I replayed your voice in my head just to feel close.",
    "The way you say my name feels so far away right now.",
    "Nothing feels as good without you to share it with.",
    "I'm sorry I made you feel unheard. I'm learning, for you.",
    "[Add one real memory of you two here]"
  ],
  allDone: "That's the whole sky. Every single star was you. 💫",
  endTitle: "If you're ready, panda, I'd love to talk.",
  endText: "No pressure. Whatever you decide, I'll respect it, and I'll still be thinking of you.",
  contactLink: "https://wa.me/910000000000?text=Hii%20pandaaa%2C%20I%20saw%20it.%20Let%27s%20talk.",
  talkReply: "You just made my whole world lighter. 🐼💖",
  moreTimeReply: "That's okay. Take all the time you need. I'll be here when you're ready."
};
/* ======================================================= */
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* panda drawing */
const PANDA=`<svg viewBox="0 0 200 190" aria-hidden="true">
<circle cx="42" cy="42" r="28" fill="#15151f"/><circle cx="158" cy="42" r="28" fill="#15151f"/>
<ellipse cx="100" cy="108" rx="82" ry="72" fill="#f7f7fb"/>
<ellipse cx="66" cy="102" rx="19" ry="25" fill="#15151f" transform="rotate(25 66 102)"/>
<ellipse cx="134" cy="102" rx="19" ry="25" fill="#15151f" transform="rotate(-25 134 102)"/>
<g class="eyes"><circle cx="68" cy="100" r="8" fill="#fff"/><circle cx="69" cy="102" r="4.5" fill="#15151f"/>
<circle cx="132" cy="100" r="8" fill="#fff"/><circle cx="131" cy="102" r="4.5" fill="#15151f"/></g>
<ellipse class="tear" cx="62" cy="116" rx="3" ry="5"/>
<ellipse cx="100" cy="126" rx="10" ry="7" fill="#15151f"/>
<path d="M90 138q10 9 10 0q0 9 10 0" fill="none" stroke="#15151f" stroke-width="3" stroke-linecap="round"/>
<circle class="blush" cx="38" cy="132" r="11" fill="#ff9fb8" opacity=".55"/><circle class="blush" cx="162" cy="132" r="11" fill="#ff9fb8" opacity=".55"/></svg>`;
document.querySelectorAll('.panda').forEach(p=>{p.innerHTML=PANDA;if(p.dataset.mood==='happy')p.classList.add('happy')});

/* intro */
$('hi').innerHTML=[...CONFIG.intro].map((c,i)=>`<span style="--i:${i}">${c===' '?'&nbsp;':c}</span>`).join('');
function openSite(){
  const el=$('intro');if(el.classList.contains('gone'))return;
  el.classList.add('gone');document.body.classList.remove('locked');
  setTimeout(()=>el.remove(),1500);
}
$('intro').addEventListener('click',openSite);
$('intro').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openSite()});

/* live counter */
(function(){
  const t=new Date(CONFIG.sinceDate).getTime();
  if(!CONFIG.sinceDate||isNaN(t)){$('since').style.display='none';return}
  function up(){let s=Math.max(0,Math.floor((Date.now()-t)/1000));
    const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
    $('since').innerHTML=`<b>${d}</b> days <b>${h}</b> hours <b>${m}</b> minutes <b>${s}</b> seconds ${CONFIG.sinceLabel}`}
  up();setInterval(up,1000);
})();

/* scroll reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.25});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));

/* story: typewriter */
let i=0,typing=false;
const line=$('line'),next=$('next');
function typeLine(){
  const txt=CONFIG.story[i];typing=true;
  line.className='line';line.textContent='';next.classList.remove('ready');
  let k=0;
  (function tick(){
    if(reduce)k=txt.length;
    line.textContent=txt.slice(0,k);
    if(k++<txt.length)return setTimeout(tick,48);
    line.classList.add('done');typing=false;next.classList.add('ready');
  })();
}
let started=false;
new IntersectionObserver((es,o)=>{if(es[0].isIntersecting&&!started){started=true;typeLine();o.disconnect()}},{threshold:.5}).observe($('story'));
next.addEventListener('click',()=>{
  if(typing)return;
  if(i>=CONFIG.story.length-1){$('stars').scrollIntoView({behavior:reduce?'auto':'smooth'});return}
  line.classList.add('out');
  setTimeout(()=>{i++;typeLine();if(i===CONFIG.story.length-1)next.textContent='Keep going ↓'},reduce?0:800);
});

/* constellation */
const box=$('sky2'),svg=$('links');
const Y=[62,28,70,35,75,25,55];
const pts=CONFIG.thoughts.map((_,k,a)=>({x:10+80*(k/((a.length-1)||1)),y:Y[k%7]}));
let seen=new Set(),order=[];
pts.forEach((p,k)=>{
  const b=document.createElement('button');
  b.className='star';b.style.left=p.x+'%';b.style.top=p.y+'%';b.style.setProperty('--d',(k*.4)+'s');
  b.setAttribute('aria-label','Star '+(k+1));
  b.addEventListener('click',()=>{
    const t=$('thought');t.classList.remove('swap');void t.offsetWidth;t.textContent=CONFIG.thoughts[k];t.classList.add('swap');
    const r=document.createElement('span');r.className='ring';b.appendChild(r);setTimeout(()=>r.remove(),1000);
    if(!seen.has(k)){seen.add(k);order.push(k);b.classList.add('on');
      if(order.length>1){const a=pts[order[order.length-2]];
        svg.insertAdjacentHTML('beforeend',`<line x1="${a.x}%" y1="${a.y}%" x2="${p.x}%" y2="${p.y}%" stroke="#f5b86b" stroke-opacity=".55"/>`)}}
    if(seen.size===pts.length){$('note').textContent=CONFIG.allDone;burst(innerWidth/2,innerHeight/2,40)}
  });
  box.appendChild(b);
});

/* ending */
$('endTitle').textContent=CONFIG.endTitle;
$('endText').textContent=CONFIG.endText;
$('talk').href=CONFIG.contactLink;
$('talk').addEventListener('click',()=>{
  $('endPanda').classList.add('happy');$('reply').textContent=CONFIG.talkReply;
  burst(innerWidth/2,innerHeight*.6,90);
});
$('time').addEventListener('click',()=>{$('reply').textContent=CONFIG.moreTimeReply});

/* effects canvas: twinkles, shooting stars, fireflies, heart bursts */
const cv=$('fx'),ctx=cv.getContext('2d');
let W,H,st=[],fl=[],sh=[],hb=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  st=Array.from({length:Math.floor(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6}));
  fl=Array.from({length:reduce?0:18},()=>({x:Math.random()*W,y:Math.random()*H,r:1.5+Math.random()*2,vy:-.15-Math.random()*.35,p:Math.random()*6}))}
addEventListener('resize',size);size();
function burst(x,y,n){if(reduce)return;for(let k=0;k<n;k++)hb.push({x,y,s:5+Math.random()*10,vx:(Math.random()-.5)*9,vy:-Math.random()*9-1,a:1,c:['#ff9fb8','#f5b86b','#e8ecff'][k%3]})}
function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s/4);ctx.bezierCurveTo(x,y-s/2,x-s,y-s/2,x-s,y+s/4);
  ctx.bezierCurveTo(x-s,y+s,x,y+s*1.2,x,y+s*1.5);ctx.bezierCurveTo(x,y+s*1.2,x+s,y+s,x+s,y+s/4);
  ctx.bezierCurveTo(x+s,y-s/2,x,y-s/2,x,y+s/4);ctx.fill()}
setInterval(()=>{if(!reduce&&!document.hidden)sh.push({x:Math.random()*W*.8+W*.2,y:Math.random()*H*.4,l:0})},5000);
(function loop(t){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#e8ecff';
  for(const s of st){ctx.globalAlpha=reduce?.5:.25+.5*Math.abs(Math.sin(t/1800+s.p));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill()}
  ctx.fillStyle='#f5b86b';
  for(const f of fl){f.y+=f.vy;f.x+=Math.sin(t/1200+f.p)*.3;if(f.y<-10){f.y=H+10;f.x=Math.random()*W}
    ctx.globalAlpha=.25+.5*Math.abs(Math.sin(t/900+f.p));ctx.shadowColor='#f5b86b';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill()}
  ctx.shadowBlur=0;
  sh=sh.filter(s=>s.l<1);
  for(const s of sh){s.l+=.02;const x=s.x-s.l*260,y=s.y+s.l*140;
    const g=ctx.createLinearGradient(x,y,x+90,y-49);g.addColorStop(0,'rgba(255,255,255,'+(1-s.l)+')');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalAlpha=1;ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+90,y-49);ctx.stroke()}
  hb=hb.filter(h=>h.a>.02);
  for(const h of hb){h.x+=h.vx;h.y+=h.vy;h.vy+=.2;h.a-=.009;ctx.globalAlpha=h.a;ctx.fillStyle=h.c;heart(h.x,h.y,h.s/2)}
  ctx.globalAlpha=1;requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
